name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# One job: the debug gates from the README (unit tests, lint) plus the release
# package. The daemon JVM pin (gradle/gradle-daemon-jvm.properties) and the
# wrapper pin the toolchain; Temurin 25 is installed to match the pin, so no
# JDK is provisioned on the runner.
#
# keystore.properties and *.keystore are never committed, so a plain CI run
# uploads an unsigned LeafConnect.apk. When the repository defines the secrets
# LEAF_KEYSTORE_BASE64, LEAF_STORE_PASSWORD and LEAF_KEY_PASSWORD, the signing
# material is restored first and every published release asset is signed.
#
# Publishing: the published release uses ONE fixed tag (release-latest), which
# is deleted and recreated on every push to main, so the repository holds
# exactly one release at any time and never accumulates tags; the commit sha
# stays visible in the title. Every pull request gets its own prerelease
# (tag pr-<number>) that is replaced on each new push to that PR.
jobs:
  build-test-lint:
    name: Build, test, lint
    # Ubuntu latest ships the Android SDK. GitHub may emit an informational
    # annotation while the ubuntu-latest label migrates to Ubuntu 26.
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      LEAF_KEYSTORE_BASE64: ${{ secrets.LEAF_KEYSTORE_BASE64 }}
      LEAF_STORE_PASSWORD: ${{ secrets.LEAF_STORE_PASSWORD }}
      LEAF_KEY_PASSWORD: ${{ secrets.LEAF_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # setup-android@v3 is a Node 20 action and defaults to the removed `tools`
      # package. v4 is Node 24 and defaults to platform-tools; the SDK itself is
      # preinstalled on the Ubuntu runner image.
      - uses: android-actions/setup-android@v4

      - name: Restore signing material (skipped without secrets)
        if: env.LEAF_KEYSTORE_BASE64 != ''
        run: |
          echo "$LEAF_KEYSTORE_BASE64" | base64 -d > leafconnect.keystore
          {
            echo "storeFile=leafconnect.keystore"
            echo "storePassword=$LEAF_STORE_PASSWORD"
            echo "keyAlias=leafconnect"
            echo "keyPassword=$LEAF_KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint gate
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Release package
        run: ./gradlew :app:packageLeafConnect --stacktrace

      # upload-artifact@v4/v5 are Node 20 actions. v7 is Node 24 and keeps the
      # same name/path inputs.
      - uses: actions/upload-artifact@v7
        with:
          name: LeafConnect-release
          path: app/build/outputs/apk/release/LeafConnect.apk

      - name: Publish the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          # Exactly one published release. Drop the previous release and its
          # tag first (the tag can exist without a release, so clear the ref
          # too), then publish this commit under the SAME fixed tag. Releases
          # published by the older release-<sha> scheme are swept away here as
          # well; PR prereleases are never touched.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name | startswith("release-")) | .tag_name' |
            while read -r tag; do
              if [ "$tag" != "release-latest" ]; then
                gh release delete "$tag" --yes --delete-tag || true
              fi
            done
          gh release delete release-latest --yes --delete-tag 2>/dev/null || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/release-latest" 2>/dev/null || true
          gh release create release-latest --target "$GITHUB_SHA" \
            --title "LeafConnect $SHORT" \
            --notes "$(git log -1 --pretty=%s)" \
            app/build/outputs/apk/release/LeafConnect.apk

      - name: Publish PR preview prerelease
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh release delete "pr-$PR_NUMBER" --yes --delete-tag 2>/dev/null || true
          gh release create "pr-$PR_NUMBER" --target "$PR_HEAD" --prerelease \
            --title "LeafConnect PR #$PR_NUMBER preview" \
            --notes "Preview build for PR #$PR_NUMBER at $PR_HEAD." \
            app/build/outputs/apk/release/LeafConnect.apk
