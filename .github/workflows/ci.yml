name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# One job: the debug gates from the README (unit tests, lint) plus the release
# package. The daemon JVM pin (gradle/gradle-daemon-jvm.properties) and the
# wrapper pin the toolchain; Temurin 25 is installed to match the pin, so no
# JDK is provisioned on the runner.
#
# keystore.properties and *.keystore are never committed, so a plain CI run
# uploads an unsigned LeafConnect.apk. When the repository defines the secrets
# LEAF_KEYSTORE_BASE64, LEAF_STORE_PASSWORD and LEAF_KEY_PASSWORD, the signing
# material is restored first and every published release asset is signed.
#
# Publishing: the published release uses ONE fixed tag (release-latest), so the
# repository holds exactly one release at any time. published_at is immutable, so
# moving the "Published" date means deleting the release AND its tag ref and
# republishing. GitHub refuses ref deletions made by the Actions token and refuses
# POST /releases for a tag_name that already exists, so a plain Actions run keeps
# the release alive and retargets it in place (same asset, original date), with
# the build time in the title and body so it still reads as current. A run
# replayed with a token that may delete refs — or after the tag ref was deleted
# from a developer machine — deletes and republishes, and the date moves. Every
# pull request gets its own prerelease (tag pr-<number>) updated the same way on
# each push to that PR.
jobs:
  build-test-lint:
    name: Build, test, lint
    # Ubuntu latest ships the Android SDK. GitHub may emit an informational
    # annotation while the ubuntu-latest label migrates to Ubuntu 26.
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      LEAF_KEYSTORE_BASE64: ${{ secrets.LEAF_KEYSTORE_BASE64 }}
      LEAF_STORE_PASSWORD: ${{ secrets.LEAF_STORE_PASSWORD }}
      LEAF_KEY_PASSWORD: ${{ secrets.LEAF_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # setup-android@v3 is a Node 20 action and defaults to the removed `tools`
      # package. v4 is Node 24 and defaults to platform-tools; the SDK itself is
      # preinstalled on the Ubuntu runner image.
      - uses: android-actions/setup-android@v4

      - name: Restore signing material (skipped without secrets)
        if: env.LEAF_KEYSTORE_BASE64 != ''
        run: |
          echo "$LEAF_KEYSTORE_BASE64" | base64 -d > leafconnect.keystore
          {
            echo "storeFile=leafconnect.keystore"
            echo "storePassword=$LEAF_STORE_PASSWORD"
            echo "keyAlias=leafconnect"
            echo "keyPassword=$LEAF_KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint gate
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Release package
        run: ./gradlew :app:packageLeafConnect --stacktrace

      # upload-artifact@v4/v5 are Node 20 actions. v7 is Node 24 and keeps the
      # same name/path inputs.
      - uses: actions/upload-artifact@v7
        with:
          name: LeafConnect-release
          path: app/build/outputs/apk/release/LeafConnect.apk

      - name: Publish the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          MESSAGE="$(git log -1 --pretty=%s)"
          # GitHub keeps the original published_at when a release is updated in
          # place, so the page's "Published" date never moves. The build time is
          # put in the title and body instead: the release says when it was
          # built, which is what the stale label cannot show.
          NOW="$(date -u +'%Y-%m-%d %H:%M UTC')"
          TITLE="LeafConnect $SHORT ($NOW)"
          BODY="$(printf '%s\n\nBuilt: %s\nCommit: %s' "$MESSAGE" "$NOW" "$GITHUB_SHA")"
          # Sweep the releases published by the older release-<sha> scheme, via
          # the API (a release delete is allowed; deleting the tag ref it
          # carried is best-effort because GitHub refuses ref deletions made by
          # the Actions token). PR prereleases and release-latest are untouched.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name | startswith("release-")) | [.id, .tag_name] | @tsv' |
            while read -r id tag; do
              case "$id" in
                ''|*[!0-9]*) continue ;;
              esac
              if [ "$tag" != "release-latest" ]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
              fi
            done
          # Exactly ONE release on release-latest. published_at is immutable: an
          # in-place PATCH keeps the date of the first publish, so moving the
          # "Published" label means deleting the release and publishing a new one.
          # That also needs the tag ref gone: POST /releases refuses a tag_name
          # that already exists (proven by run 17 — the release was deleted and
          # the republish failed), and the Actions token cannot delete refs. So
          # the ref is deleted first and the republish only runs when BOTH
          # deletions succeed; otherwise the release is retargeted in place.
          # gh prints the 404 body to stdout when --jq is used, so a missing
          # release would otherwise land in ID and the fallback path would
          # address that JSON. Anything non-numeric means "no release yet".
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/release-latest" --jq '.id' 2>/dev/null || true)"
          case "$ID" in
            ''|*[!0-9]*) ID="" ;;
          esac
          # Ref first: deleting only the release leaves a tag no release can be
          # published onto. A refused delete keeps ID set, so the release is
          # retargeted in place instead — same asset, original date.
          if [ -n "$ID" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/release-latest" 2>/dev/null \
             && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID" 2>/dev/null; then
            ID=""
          fi
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$TITLE" \
              -f body="$BODY" \
              -F make_latest=true
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="release-latest" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$TITLE" \
              -f body="$BODY" \
              -F make_latest=true
          fi
          # Point the tag at this commit too; a tag ref update can be refused for
          # token-created refs, and the release target above is then what carries
          # the new commit.
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/release-latest" -f sha="$GITHUB_SHA" || true
          gh release upload release-latest app/build/outputs/apk/release/LeafConnect.apk --clobber

      - name: Publish PR preview prerelease
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Same update-in-place rule as the main release: the Actions token
          # cannot delete the release/tag it created, so a second push to the
          # PR retargets the existing prerelease instead of recreating it.
          # Same numeric guard as the main release step: a 404 body must never
          # reach the PATCH path.
          ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/pr-$PR_NUMBER" --jq '.id' 2>/dev/null || true)"
          case "$ID" in
            ''|*[!0-9]*) ID="" ;;
          esac
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -f target_commitish="$PR_HEAD" \
              -f body="Preview build for PR #$PR_NUMBER at $PR_HEAD."
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/pr-$PR_NUMBER" -f sha="$PR_HEAD" || true
            gh release upload "pr-$PR_NUMBER" app/build/outputs/apk/release/LeafConnect.apk --clobber
          else
            gh release create "pr-$PR_NUMBER" --target "$PR_HEAD" --prerelease \
              --title "LeafConnect PR #$PR_NUMBER preview" \
              --notes "Preview build for PR #$PR_NUMBER at $PR_HEAD." \
              app/build/outputs/apk/release/LeafConnect.apk
          fi
