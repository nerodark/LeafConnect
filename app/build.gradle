// Android application module. Kotlin comes from AGP 9's built-in Kotlin
// support; everything shared with iOS lives in :shared.
plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.compose.compiler)
}

// Signing material is NEVER in the repo: keystore.properties (gitignored)
// points at a keystore created on the developer's machine. Without the file,
// the release build stays unsigned instead of failing cryptically.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Compose resources live in :shared (`src/commonMain/composeResources`). The
// resources plugin copies a module's resources into that module's own assets,
// and an Android library's assets are not merged into the application — so the
// generated .cvr/drawable files are packaged here. The destination layout is
// exactly what the generated accessors ask for:
// assets/composeResources/<packageOfResClass>/...
def sharedPreparedResources = project(':shared').layout.buildDirectory
        .dir('generated/compose/resourceGenerator/preparedResources/commonMain/composeResources')
def composeAssetsDir = layout.buildDirectory.dir('generated/composeAssets')

def copySharedComposeResources = tasks.register('copySharedComposeResources', Copy) {
    dependsOn ':shared:prepareComposeResourcesTaskForCommonMain'
    from(sharedPreparedResources)
    into(composeAssetsDir.map { it.dir('composeResources/leafconnect.generated.resources') })
}

android {
    namespace = 'com.leafconnect'
    // androidx.core 1.18 and OkHttp 5 (via Ktor) compile against SDK 37.
    compileSdk = 37

    defaultConfig {
        applicationId = "com.leafconnect"
        minSdk = 26
        targetSdk = 35
        versionCode = 202429049
        versionName = "1.0.0"
    }

    buildFeatures {
        // The Activity in this module hosts the shared Compose UI.
        compose = true
    }

    signingConfigs {
        if (hasKeystore) {
            leaf {
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled = false
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No keystore.properties (fresh clone, CI): produce an unsigned
            // release instead of failing with empty passwords.
            if (hasKeystore) {
                signingConfig = signingConfigs.leaf
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Real gate: the build fails on lint errors, with the justified
        // suppressions listed in app/lint.xml.
        abortOnError = true
        lintConfig = file('lint.xml')
        checkReleaseBuilds = true
    }
}

// The copied resources are assets of this module. AGP rejects Provider
// instances in the SourceSet API, so the directory resolves to a File here,
// and every task that consumes assets (merge, lint models) must depend on the
// copy — Gradle otherwise reports an implicit dependency on the generated dir.
android.sourceSets['main'].assets.srcDir(composeAssetsDir.get().asFile)
tasks.matching {
    (it.name.startsWith('merge') && it.name.endsWith('Assets')) || it.name.toLowerCase().contains('lint')
}.configureEach {
    dependsOn copySharedComposeResources
}

tasks.register('packageLeafConnect') {
    group = 'build'
    description = 'Produces LeafConnect.apk from the release build.'
    dependsOn 'assembleRelease'
    doLast {
        def dir = layout.buildDirectory.file('outputs/apk/release').get().asFile
        // Signed builds emit app-release.apk; without keystore.properties AGP
        // writes app-release-unsigned.apk. Take whichever the build produced.
        def src = ['app-release.apk', 'app-release-unsigned.apk']
                .collect { new File(dir, it) }
                .find { it.exists() }
        if (src == null) {
            throw new GradleException('assembleRelease produced no release APK')
        }
        new File(dir, 'LeafConnect.apk').bytes = src.bytes
    }
}

dependencies {
    implementation project(':shared')
    implementation libs.androidx.activity.compose
    implementation libs.androidx.core.ktx
    implementation libs.androidx.core.splashscreen
}
